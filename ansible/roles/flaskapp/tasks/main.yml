- name: Update dnf package cache
  ansible.builtin.dnf:
    update_cache: true

- name: Install system packages (python3, pip, nginx)
  ansible.builtin.dnf:
    name:
      - python3
      - python3-pip
      - nginx
    state: present

- name: Create app install directory
  ansible.builtin.file:
    path: "{{ app_install_dir }}"
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: "0755"

- name: Copy Flask app code
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/{{ item }}"
    dest: "{{ app_install_dir }}/{{ item }}"
    owner: ec2-user
    group: ec2-user
    mode: "0644"
  loop:
    - app.py
    - requirements.txt

- name: Create Python virtual environment and install dependencies
  ansible.builtin.pip:
    requirements: "{{ app_install_dir }}/requirements.txt"
    virtualenv: "{{ app_install_dir }}/venv"
    virtualenv_command: python3 -m venv

- name: Template systemd service file
  ansible.builtin.template:
    src: flaskapp.service.j2
    dest: /etc/systemd/system/flaskapp.service
    mode: "0644"
  notify: restart flaskapp

- name: Enable and start flaskapp service
  ansible.builtin.systemd:
    name: flaskapp
    enabled: true
    state: started
    daemon_reload: true

- name: Template Nginx site config
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/conf.d/flaskapp.conf
    mode: "0644"
  notify: restart nginx

- name: Remove default Nginx welcome config (avoid conflicting with our proxy config)
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  when: false  # Amazon Linux 2023's nginx package doesn't ship a conflicting default.conf; left here intentionally in case you swap distros later

- name: Enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started